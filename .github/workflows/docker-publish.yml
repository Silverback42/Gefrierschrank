name: Docker Image bauen und veröffentlichen

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/silverback42/gefrierschrank

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Von Actions automatisch pro Run erzeugt, laeuft nie ab.
          # Schreibrecht kommt aus permissions.packages: write (oben).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Image pushen
        run: |
          docker push $IMAGE_NAME:latest
